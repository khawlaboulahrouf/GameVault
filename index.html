<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameVault</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-5">

  <div class="flex justify-between items-center mb-5">
    <h1 class="text-2xl font-bold text-orange-500">GameVault</h1>

    <a href="cart.html" class="bg-orange-500 text-white px-4 py-2 rounded-lg">
      Voir Panier 🛒
    </a>
  </div>

  <!-- Search -->
  <input 
    type="text" 
    id="searchInput"
    placeholder="Search a game..."
    class="w-full mb-5 p-2 rounded-lg border"
  />

  <!-- Filters -->
  <div class="flex gap-2 mb-5">
    <button class="filter-btn bg-green-500 text-white px-3 py-1 rounded" data-category="All">All</button>
    <button class="filter-btn bg-gray-200 px-3 py-1 rounded" data-category="RPG">RPG</button>
    <button class="filter-btn bg-gray-200 px-3 py-1 rounded" data-category="Action">Action</button>
    <button class="filter-btn bg-gray-200 px-3 py-1 rounded" data-category="Sport">Sport</button>
  </div>

  <!-- Games -->
  <div id="games-container" 
    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
  </div>

  <script type="module" src="main.js"></script>

</body>
</html>
