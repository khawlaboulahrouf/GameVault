<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>GameVault</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-5">

    <h1 class="text-2xl font-bold text-orange-500 mb-5">
        GameVault
    </h1>
    <!-- searchInput -->
    <input type="text" id="searchInput" placeholder="Search a game..."
        class="w-full mb-5 p-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-orange-400" />
    <!-- Filters -->
    <div class="flex gap-2 mb-5">
        <button class="filter-btn bg-green-500 text-white px-3 py-1 rounded-lg" data-category="All">All</button>
        <button class="filter-btn bg-gray-200 px-3 py-1 rounded-lg" data-category="RPG">RPG</button>
        <button class="filter-btn bg-gray-200 px-3 py-1 rounded-lg" data-category="Action">Action</button>
        <button class="filter-btn bg-gray-200 px-3 py-1 rounded-lg" data-category="Sport">Sport</button>
        <button class="filter-btn bg-gray-200 px-3 py-1 rounded-lg" data-category="FPS">FPS</button>

    </div>

    <div id="games-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
    </div>

    <script type="module" src="main.js"></script>

</body>

</html>
